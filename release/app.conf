# Release settings for tools/release.sh and tools/withdraw.sh (sourced by bash). Another app (e.g. Mensa MD) copies
# tools/ and writes its own release/app.conf plus release/signing-cert.sha256. No secrets here: gh keeps its own
# login (gh auth login), the signing credentials come from ~/.gradle/gradle.properties.
APP_NAME="Stundenplan MD"
APP_ID="de.luwify.stundenplanmd"
# File names: <slug>-<version>.apk, <slug>-<version>-src.tar.gz
APP_SLUG="stundenplan-md"

# GitHub repo (owner/name): code, tags and releases. updates.json is an asset of every release (full history);
# the app reads the one of the latest release.
GH_REPO="Luwify/ovgu-stundenplan"

# Working repo: releases only from this branch; the tag v<version> is pushed to this remote (must be $GH_REPO).
WORK_BRANCH="main"
WORK_REMOTE="origin"

JAVA_HOME_DEFAULT="$HOME/dev/android-studio/jbr"
GRADLE_CHECKS="testDebugUnitTest lint"
GRADLE_ASSEMBLE=":app:assembleRelease"
APK_PATH="app/build/outputs/apk/release/app-release.apk"
# Writes/validates updates.json with the app's own parser (core/src/test/.../ManifestTool.kt).
MANIFEST_TASK=":core:manifest"
